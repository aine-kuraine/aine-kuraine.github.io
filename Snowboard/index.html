<title>JSBA想定問題集（教程＆オフィシャルハンドブック）</title>
<style>
:root{--bg:#eef2f5;--sheet:#fff;--ink:#1d2731;--muted:#5d6b78;--line:#d5dde4;--accent:#1f5f8b;--ng:#d23b3b}
@media (prefers-color-scheme:dark){:root{--bg:#11171d;--sheet:#18212a;--ink:#e4ebf1;--muted:#97a6b4;--line:#2a3743;--accent:#7fb5dc;--ng:#ff7a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;padding:16px}
form{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:grid;gap:14px}
h1{font-size:1.15rem;margin:0}
p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.7}
input[type=password]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label.rm{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
button{font-size:1rem;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--sheet);font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--ng);min-height:1.2em}
</style></head><body>

</form>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function show(html){document.open();document.write(html);document.close()}
async function open_(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},k,d64(P.c));
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d64(P.s),iterations:P.n},base,256);
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(AK)}catch(e){}
  if(saved){try{show(await open_(d64(saved)));return}catch(e){try{localStorage.removeItem(AK)}catch(_){}}}
  const f=document.getElementById('f');f.hidden=false;document.getElementById('pw').focus();
  f.addEventListener('submit',async ev=>{ev.preventDefault();
    const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;btn.textContent='確認中…';err.textContent='';
    try{const raw=await derive(document.getElementById('pw').value);const html=await open_(raw);
      if(document.getElementById('rm').checked){try{localStorage.setItem(AK,e64(raw))}catch(e){}}show(html);
    }catch(e){btn.disabled=false;btn.textContent='開く';err.textContent='パスワードが違います。'}
  });
})();
