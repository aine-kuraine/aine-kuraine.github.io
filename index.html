<style>
:root{--bg:#eef2f5;--sheet:#fff;--ink:#1d2731;--muted:#5d6b78;--line:#d5dde4;--accent:#1f5f8b;--ng:#d23b3b}
@media (prefers-color-scheme:dark){:root{--bg:#11171d;--sheet:#18212a;--ink:#e4ebf1;--muted:#97a6b4;--line:#2a3743;--accent:#7fb5dc;--ng:#ff7a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;padding:16px}
form{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:grid;gap:14px}
h1{font-size:1.15rem;margin:0}
p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.7}
input[type=password]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label.rm{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
button{font-size:1rem;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--sheet);font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--ng);min-height:1.2em}
</style></head><body>

</form>

async function open_(raw){
